title = "Qualitative forced turbulence"
output_dir = "outputs"

[equations]
type = "shear"
mode = "nonlinear"

[grid]
Nx = 64
Ny = 64
Nz = 64
Lx = 6.283185307179586
Ly = 6.283185307179586
Lz = 6.283185307179586

[time]
tmax = 4.0
dt_init = 0.01
dt_max = 0.015
cfl_number = 0.35
use_variable_dt = true

[output]
t_out_scal = 0.5
t_out_spec = 1.0
t_out_full = 0.0

[backend]
backend = "numpy"
fft_workers = 8
real_dtype = "float64"
complex_dtype = "complex128"

[runtime]
runtime_check_every = 10
progress_output_every = 100
fail_on_nonfinite = true
dealias = true
dealias_mode = "two_thirds"

[physics]
vA = 1.0
cs2_over_vA2 = 1.0
N2 = 1.0
Ku = 0.0

[dissipation_stop]

[forcing]
use_forcing = true
forcing_mode = "elsasser"
n_min_force = 1.0
n_max_force = 3.0
alpha_force = 0.5
forcing_seed = 1234
epsilon_plus = 0.35
epsilon_minus = 0.35

[forcing.field_energy_injection_rates]
psi = 0.0
omega = 0.0
upar = 0.0005
dbpar = 0.001

[dissipation]
mode = "manual"
n_perp = 3
n_par = 3
nu_par = 0.0
kd_fraction = 0.6
shell_half_width = 0.5
update_every = 10
smooth_factor = 0.2
nu_min = 1e-12
nu_max = 100.0
max_update_factor = 2.0

[dissipation.psi]
nu_perp = 7.06021003826284e-08
nu_par = 7.06021003826284e-09
n_perp = 3
n_par = 1

[dissipation.omega]
nu_perp = 7.06021003826284e-08
nu_par = 7.06021003826284e-09
n_perp = 3
n_par = 1

[dissipation.upar]
nu_perp = 7.06021003826284e-08
nu_par = 7.06021003826284e-09
n_perp = 3
n_par = 1

[dissipation.dbpar]
nu_perp = 7.06021003826284e-08
nu_par = 7.06021003826284e-09
n_perp = 3
n_par = 1

[initial_condition]
type = "zero"
