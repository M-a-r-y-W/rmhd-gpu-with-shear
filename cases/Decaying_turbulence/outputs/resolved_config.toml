title = "Qualitative decaying turbulence spectra"
output_dir = "outputs"

[equations]
type = "shear"
mode = "nonlinear"

[grid]
Nx = 128
Ny = 128
Nz = 128
Lx = 6.283185307179586
Ly = 6.283185307179586
Lz = 6.283185307179586

[time]
tmax = 8.0
dt_init = 0.01
dt_max = 0.02
cfl_number = 0.5
use_variable_dt = true

[output]
t_out_scal = 0.5
t_out_spec = 0.5
t_out_full = 0.0

[backend]
backend = "numpy"
fft_workers = 8
real_dtype = "float64"
complex_dtype = "complex128"

[runtime]
runtime_check_every = 10
progress_output_every = 100
fail_on_nonfinite = true
dealias = true
dealias_mode = "two_thirds"

[physics]
vA = 1.0
cs2_over_vA2 = 1.0
N2 = 1.0
Ku = 0.0

[dissipation_stop]

[forcing]
use_forcing = false
forcing_mode = "field"
n_min_force = 1.0
n_max_force = 3.0
alpha_force = 0.0
epsilon_plus = 0.0
epsilon_minus = 0.0

[forcing.field_energy_injection_rates]
psi = 0.0
omega = 0.0
upar = 0.0
dbpar = 0.0

[dissipation]
mode = "manual"
n_perp = 3
n_par = 3
nu_par = 0.0
kd_fraction = 0.6
shell_half_width = 0.5
update_every = 10
smooth_factor = 0.2
nu_min = 1e-12
nu_max = 100.0
max_update_factor = 2.0

[dissipation.psi]
nu_perp = 1.2977767829696784e-08
nu_par = 1.2977767829696785e-09
n_perp = 3
n_par = 1

[dissipation.omega]
nu_perp = 1.2977767829696784e-08
nu_par = 1.2977767829696785e-09
n_perp = 3
n_par = 1

[dissipation.upar]
nu_perp = 1.2977767829696784e-08
nu_par = 1.2977767829696785e-09
n_perp = 3
n_par = 1

[dissipation.dbpar]
nu_perp = 1.2977767829696784e-08
nu_par = 1.2977767829696785e-09
n_perp = 3
n_par = 1

[initial_condition]
type = "random_spectrum"

[initial_condition.parameters]
n_min = 1.0
n_max = 3.0
alpha = 0.0
init_energy = 0.75
seed = 1
